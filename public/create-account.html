<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCollab - Create account</title>
    <link rel="stylesheet" href="./styles.css" />
  <script src="./session-ui.js" defer></script></head>
  <body>
    <main class="page">
      <section
        class="card create-account-card"
        aria-label="Create account page container"
      >
        <h1 class="title">Create New Account</h1>

        <form id="registerForm" class="form" action="#" method="post">
          <div class="field">
            <label for="fullName" class="label">
              Full Name<span class="req" aria-hidden="true">*</span>
            </label>
            <input
              id="fullName"
              name="fullName"
              type="text"
              required
              autocomplete="name"
            />
          </div>

          <div class="field">
            <label for="studentId" class="label">
              Student ID<span class="req" aria-hidden="true">*</span>
            </label>
            <input
              id="studentId"
              name="studentId"
              type="text"
              required
              autocomplete="username"
            />
          </div>

          <div class="field">
            <label for="email" class="label">
              Email<span class="req" aria-hidden="true">*</span>
            </label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
            />
          </div>

          <div class="field">
            <label for="password" class="label">
              Password<span class="req" aria-hidden="true">*</span>
            </label>
            <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="field">
            <label for="passwordConfirm" class="label">
              Password confirmation<span class="req" aria-hidden="true">*</span>
            </label>
            <input
              id="passwordConfirm"
              name="passwordConfirm"
              type="password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="actions">
            <button class="login-btn" type="submit">create account</button>
          </div>
        </form>

        <div
          id="passwordError"
          class="error-message"
          role="alert"
          aria-live="polite"
          hidden
        >
          The two password entries do not match. Please re-enter them.
        </div>

        <a class="login-corner" href="./login.html"
          >already have one? log in</a
        >
      </section>
    </main>

    <script>
      const registerForm = document.getElementById("registerForm");
      const passwordError = document.getElementById("passwordError");
      const passwordInput = document.getElementById("password");
      const passwordConfirmInput = document.getElementById("passwordConfirm");
      const fullNameInput = document.getElementById("fullName");
      const studentIdInput = document.getElementById("studentId");
      const emailInput = document.getElementById("email");

      registerForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;

        if (password !== passwordConfirm) {
          passwordError.textContent =
            "The two password entries do not match. Please re-enter them.";
          passwordError.hidden = false;
          return;
        }

        const fullName = fullNameInput.value.trim();
        const studentId = studentIdInput.value.trim();
        const email = emailInput.value.trim();
        passwordError.hidden = true;

        // Send registration to HTTPS backend; no password is saved in localStorage.
        fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ fullName, studentId, email, password }),
        })
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) {
              throw new Error(data.message || "Registration failed.");
            }

            registerForm.reset();
            window.location.href = "./login.html";
          })
          .catch((err) => {
            console.error("Registration error:", err);
            passwordError.textContent = err.message || "Registration failed.";
            passwordError.hidden = false;
          });
      });

      // UX: hide the error message as soon as the user edits the passwords.
      passwordInput.addEventListener("input", function () {
        passwordError.hidden = true;
      });
      passwordConfirmInput.addEventListener("input", function () {
        passwordError.hidden = true;
      });
    </script>
    <script>
      try {
        const theme = localStorage.getItem("unicollab_theme") || "day";
        document.body.dataset.theme = theme;
      } catch (e) {}
    </script>
  </body>
</html>
